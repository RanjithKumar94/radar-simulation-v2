<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ATC Radar Simulator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="container">

    <!-- ========================= -->
    <!-- Radar -->
    <!-- ========================= -->

    <div id="radarContainer">

        <canvas id="radar" width="900" height="900"></canvas>

        <div id="clock">03:00:00</div>

    </div>

    <!-- ========================= -->
    <!-- Control Panel -->
    <!-- ========================= -->

    <div id="controlPanel">

        <h2>ATC CONTROL PANEL</h2>

        <label>Active Runway</label>

        <select id="runwaySelect">
            <option value="08">RWY 08</option>
            <option value="26">RWY 26</option>
            <option value="15">RWY 15</option>
            <option value="33">RWY 33</option>
        </select>

        <hr>

        <h3>Aircraft</h3>

        <label>Callsign</label>
        <input id="callsign" type="text">

        <label>Heading</label>
        <input id="heading" type="number">

        <label>Flight Level</label>
        <input id="level" type="number">

        <label>Speed (KT)</label>
        <input id="speedInput" type="number">

        <label>Climb Rate (ft/min)</label>
        <input id="climbRateInput" type="number" placeholder="1500">

        <label>Descent Rate (ft/min)</label>
        <input id="descentRateInput" type="number" placeholder="1500">

        <label>Turn Direction</label>

        <div class="radioRow">

            <label>
                <input type="radio"
                name="turnDir"
                value="LEFT">
                Left
            </label>

            <label>
                <input type="radio"
                name="turnDir"
                value="RIGHT">
                Right
            </label>

            <label>
                <input type="radio"
                name="turnDir"
                value="SHORTEST"
                checked>
                Shortest
            </label>

        </div>

        <div class="buttonRow">

            <button id="applyBtn">
                APPLY
            </button>

            <button id="rwy26Blip">
                UNKNOWN
            </button>

        </div>

        <div class="buttonRow">

            <button id="rblBtn">
                DRAW RBL
            </button>

            <button id="clearRblBtn">
                CLEAR RBL
            </button>

        </div>

        <p id="rblStatus"></p>

        <div class="buttonRow">

            <button id="pauseBtn">
                PAUSE
            </button>

            <button id="resumeBtn">
                RESUME
            </button>

        </div>

        <hr>

        <h3>Departure</h3>

        <label>Callsign</label>
        <input id="depcallsign" type="text">

        <label>Level</label>
        <input id="deplevel" type="number">

        <label>Departure Runway</label>

        <select id="depRunway">

            <option value="08">RWY 08</option>
            <option value="26">RWY 26</option>
            <option value="15">RWY 15</option>
            <option value="33">RWY 33</option>

        </select>

        <button id="createDeparture">

            CREATE DEPARTURE

        </button>

        <hr>

        <h3>Status</h3>

        <label>Radar Range</label>

        <select id="rangeSelect">
            <option value="60" selected>60 NM</option>
            <option value="30">30 NM</option>
        </select>

        <p id="trafficCount">
            Traffic : 0
        </p>

    </div>

</div>

<script src="js/aircraft.js"></script>
<script src="js/departure.js"></script>
<script src="js/main.js"></script>
<script src="js/radar.js"></script>

</body>

</html>
